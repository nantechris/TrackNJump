<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title
      class="d-flex align-items-center justify-content-center text-center"
    >
      <img src="../../assets/icon/tracknjump.png" class="me-2" />
      <span>TrackNJump</span>
    </ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="createCompetition()">
        <ion-icon slot="icon-only" name="add-circle-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="page-title" *ngIf="competitions.length > 0">
    <h2>Concours</h2>
  </div>

  <div *ngIf="competitions.length === 0" class="empty-state">
    <ion-icon name="trophy-outline"></ion-icon>
    <p>Aucun concours</p>
    <p class="empty-hint">Créez un concours pour gérer ses épreuves</p>
    <ion-button (click)="createCompetition()">Créer un concours</ion-button>
  </div>

  <ion-list
    *ngIf="competitions.length > 0"
    lines="none"
    class="competition-list"
  >
    <ion-reorder-group
      [disabled]="false"
      (ionItemReorder)="handleCompetitionReorder($event)"
    >
      <ion-item-sliding
        *ngFor="let competition of competitions; trackBy: trackByCompetitionId"
      >
        <ion-item-options side="end">
          <ion-item-option
            color="primary"
            (click)="editCompetition(competition)"
          >
            <ion-icon slot="icon-only" name="create-outline"></ion-icon>
          </ion-item-option>
          <ion-item-option
            color="danger"
            (click)="deleteCompetition(competition)"
          >
            <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
          </ion-item-option>
        </ion-item-options>

        <ion-item
          button
          detail="false"
          class="competition-item"
          (click)="openCompetition(competition)"
        >
          <ion-icon name="trophy" slot="start" class="icon-gold"></ion-icon>
          <ion-label>
            <h2>{{ competition.name }}</h2>
            <p>{{ competition.date }}</p>
          </ion-label>
          <ion-reorder slot="end"></ion-reorder>
        </ion-item>
      </ion-item-sliding>
    </ion-reorder-group>
  </ion-list>
</ion-content>
